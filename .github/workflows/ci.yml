name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release-safety (no forbidden artifacts staged)
        run: npm run verify:release-safety

      - name: Build project
        run: npm run build

      - name: Run Node tests (includes integration and unit suites)
        run: npm test

      - name: Run TUI Bun tests (Release Gate)
        run: npm run test:tui:bun

      - name: Verify public exports after build
        run: npm run test:exports

      - name: Verify strict typecheck for tests
        run: npm run test:typecheck:strict
